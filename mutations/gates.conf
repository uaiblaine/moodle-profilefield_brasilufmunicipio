# Mutation spec for profilefield_brasilufmunicipio — run with
# `mdl mutate moodle-profilefield_brasilufmunicipio mutations/gates.conf --fast` on BOTH --db pgsql and --db mariadb.
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no `->` line is one
# no test is expected to hold: its result is the finding.
#
#     tag | file relative to the repo | perl script relative to this file

# is_ibgeid() accepts anything: an empty, non-numeric or overlong code reaches the integer column.
G1_ibgeid_shape | classes/api.php | g1_ibgeid_shape.pl
#   -> api_test::test_get_municipio_by_ibgeid
#   -> field_test::test_overlong_code_is_dropped
#   -> field_test::test_non_numeric_code_is_dropped

# encode() stores any UF, available or not.
G2_available_uf | field.class.php | g2_available_uf.pl
#   -> field_test::test_unavailable_uf_is_not_stored
#   -> field_test::test_convert_external_data

# Nothing chosen stores the old placeholder again.
G3_empty_choice | field.class.php | g3_empty_choice.pl
#   -> field_test::test_nothing_chosen_stores_empty_string

# The path is decided from the request alone: the upload form posts the selects too.
G4_form_or_external | field.class.php | g4_form_or_external.pl
#   -> field_test::test_uploaded_value_wins_over_the_upload_forms_selects

# A web service value that is not usable clears the field.
G5_unusable_external_value | field.class.php | g5_unusable_external_value.pl
#   -> field_test::test_unusable_external_value_is_refused

# A locked field takes the posted selects.
G6_locked | field.class.php | g6_locked.pl
#   -> field_test::test_locked_field_keeps_its_value

# display_data() returns the stored text unescaped.
G7_display_escape | field.class.php | g7_display_escape.pl
#   -> field_test::test_display_escapes

# get_value() accepts any stored UF.
G8_known_uf_only | field.class.php | g8_known_uf_only.pl
#   -> field_test::test_display_ignores_an_unknown_uf

# A field saved with no UF selected offers none again.
G9_no_uf_means_all | field.class.php | g9_no_uf_means_all.pl
#   -> field_test::test_no_available_uf_means_every_uf

# A required field accepts an empty UF on the server.
G10_required_uf | field.class.php | g10_required_uf.pl
#   -> field_test::test_required_uf

# An uploaded value is never validated.
G11_upload_validation | field.class.php | g11_upload_validation.pl
#   -> field_test::test_validation

# A value uploaded with only a name gets no code for the select.
G12_name_lookup_on_load | field.class.php | g12_name_lookup_on_load.pl
#   -> field_test::test_load_user_data

# A UF whose answer is unusable is emptied.
G14_failed_uf_keeps_rows | classes/api.php | g14_failed_uf_keeps_rows.pl
#   -> api_test::test_update_municipios_keeps_a_failed_uf

# An object answer is read as a list.
G15_answer_is_a_list | classes/api.php | g15_answer_is_a_list.pl
#   -> api_test::test_update_municipios_keeps_a_failed_uf

# An item without its code is inserted.
G16_item_shape | classes/api.php | g16_item_shape.pl
#   -> api_test::test_update_municipios_keeps_a_failed_uf

# The name lookup becomes case-sensitive. MariaDB compares case-insensitively anyway (PG only).
G17_name_ignores_case | classes/api.php | g17_name_ignores_case.pl
#   -> api_test::test_get_municipio_by_name

# The scheduled task succeeds when a UF failed, so it is not retried.
G18_task_fails | classes/task/update_municipios.php | g18_task_fails.pl
#   -> tasks_test::test_update_municipios

# The adhoc task drops the UFs that failed instead of queueing them again.
G19_adhoc_fails | classes/task/populate_municipios.php | g19_adhoc_fails.pl
#   -> tasks_test::test_populate_municipios

# The installation queues no first fill.
G20_install_queues | db/install.php | g20_install_queues.pl
#   -> tasks_test::test_install_queues_the_first_fill

# Deleting for a list of users deletes the context owner even when not in the list.
G21_privacy_userlist_filter | classes/privacy/provider.php | g21_privacy_userlist_filter.pl
#   -> provider_test::test_deletes_outside_the_user_context

# delete_data_for_user() deletes whatever contexts it is handed.
G22_privacy_user_context | classes/privacy/provider.php | g22_privacy_user_context.pl
#   -> provider_test::test_deletes_outside_the_user_context

# Deletes remove the user's values in every field type.
G23_privacy_datatype | classes/privacy/provider.php | g23_privacy_datatype.pl
#   -> provider_test::test_deletes

# A stored '1' counts as a value again.
G24_is_empty | field.class.php | g24_is_empty.pl
#   -> field_test::test_legacy_one_loads_as_empty

# A locked field is validated like an editable one, so a frozen select can block the form.
G25_locked_validation | field.class.php | g25_locked_validation.pl
#   -> field_test::test_locked_field_skips_validation

# The path is decided from the value alone: a number sent by a web service is read as a form's integer.
G26_form_needs_selects | field.class.php | g26_form_needs_selects.pl
#   -> field_test::test_digits_only_external_value_is_refused

# The adhoc task never gives up, queueing a retry every hour for ever.
G27_adhoc_gives_up | classes/task/populate_municipios.php | g27_adhoc_gives_up.pl
#   -> tasks_test::test_populate_municipios_gives_up
